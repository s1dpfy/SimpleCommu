{% extends 'base.html' %}

{% block content %}
<div class="w-[320px] mx-auto mt-10 mb-10">
    <fieldset class="border border-[#ccc] p-4 bg-[#f9f9f9]">
        <legend class="font-bold text-[#4a82ce] px-2">신규 회원등록</legend>
        <form method="POST" action="{% url 'signup' %}" class="flex flex-col gap-3 mt-2">
            {% csrf_token %}
            <div class="flex items-center justify-between">
                <label class="w-20">희망 아이디</label>
                <input type="text" name="username" required class="border border-[#999] px-1 py-0.5 w-[160px]">
            </div>
            <div class="flex items-center justify-between">
                <label class="w-20">비밀번호</label>
                <input type="password" name="password" required class="border border-[#999] px-1 py-0.5 w-[160px]">
            </div>
            <div class="text-[11px] text-[#666] border-t border-dashed border-[#ccc] pt-2 mt-1">
                ※ 아이디와 비밀번호는 보안을 위해 타 사이트와 다르게 설정하는 것을 권장합니다.
            </div>
            <div class="text-center mt-2 flex justify-center gap-2">
                <button type="submit" class="btn-classic w-[80px] font-bold">등록</button>
                <a href="{% url 'login' %}" class="btn-classic w-[80px] text-center no-underline block pt-0.5">취소</a>
            </div>
        </form>
    </fieldset>
</div>
{% endblock %}
