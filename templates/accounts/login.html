{% extends 'base.html' %}

{% block content %}
<div class="w-[300px] mx-auto mt-10 mb-10">
    <fieldset class="border border-[#ccc] p-4 bg-[#f9f9f9]">
        <legend class="font-bold text-[#4a82ce] px-2">회원 로그인</legend>
        <form method="POST" action="{% url 'login' %}" class="flex flex-col gap-3 mt-2">
            {% csrf_token %}
            <div class="flex items-center justify-between">
                <label class="w-16">아이디</label>
                <input type="text" name="username" required class="border border-[#999] px-1 py-0.5 w-[180px]">
            </div>
            <div class="flex items-center justify-between">
                <label class="w-16">비밀번호</label>
                <input type="password" name="password" required class="border border-[#999] px-1 py-0.5 w-[180px]">
            </div>
            <div class="text-center mt-2">
                <button type="submit" class="btn-classic w-[80px]">확인</button>
            </div>
        </form>
    </fieldset>
    <div class="text-center mt-4 text-[#666]">
        회원이 아니십니까? <a href="{% url 'signup' %}" class="text-[#0000ee] hover:underline">회원가입</a>
    </div>
</div>
{% endblock %}
